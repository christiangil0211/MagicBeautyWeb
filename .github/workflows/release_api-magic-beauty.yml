# Despliega solo el backend (MagicBeauty.Store.Api) en Azure App Service api-magic-beauty.
# Autenticacion OIDC con los secrets que creo Azure Deployment Center (sin publish profile).
# La credencial federada confia en la rama release: el job de deploy no usa environment.

name: Deploy backend - api-magic-beauty

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  API_PROJECT: backend/src/MagicBeauty.Store.Api/MagicBeauty.Store.Api.csproj
  DOTNET_VERSION: '10.0.x'
  ARTIFACT_NAME: api-magic-beauty

concurrency:
  group: deploy-api-magic-beauty
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$API_PROJECT"

      - name: Build
        run: dotnet build "$API_PROJECT" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "$API_PROJECT" --configuration Release --no-build --output "${{ runner.temp }}/api"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/api
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # requerido para el token OIDC
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: api

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D9A2CAC0D674464A9D1DA311FC95F72 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15236B2C08C6412BAB0B194CDDCCC1A6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D829F3114294A5DAB3442920C1A08A9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-magic-beauty
          slot-name: Production
          package: api
