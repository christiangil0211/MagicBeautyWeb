<app-portal-banner [banner]="banner()" (contentRequested)="scrollToContent()" />

<div class="portal-body" [class.portal-body--no-banner]="!banner()">
  <nav class="tabs" aria-label="Secciones del portal">
    @for (tab of tabs; track tab.path) {
      <a
        class="tabs__link"
        [routerLink]="tab.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        #link="routerLinkActive"
        [attr.aria-current]="link.isActive ? 'page' : null">
        <span class="tabs__icon">
          <i [class]="tab.icon"></i>
          <!-- Móvil: el texto va debajo, así que el número se apoya sobre el ícono. -->
          @if (tab.path === '/pedido' && orderCount() > 0) {
            <span class="tabs__count tabs__count--icon" aria-hidden="true">{{ orderCount() }}</span>
          }
        </span>
        <span class="tabs__label">{{ tab.label }}</span>
        <span class="tabs__short">{{ tab.shortLabel }}</span>
        <!-- Escritorio: el número va al lado del texto, sin taparlo. -->
        @if (tab.path === '/pedido' && orderCount() > 0) {
          <span class="tabs__count tabs__count--inline" [attr.aria-label]="orderCount() + ' unidades en tu pedido'">{{ orderCount() }}</span>
        }
      </a>
    }
  </nav>

  <div class="portal-content" #content>
    <router-outlet />
  </div>
</div>
